# Official luvus agent-detection manifest for Claude Code.
# Served at https://luvus.dev/manifests/claude.toml and fetched by
# `luvus server update-manifest`, so detection keeps up with Claude Code UI
# changes without waiting for a luvus binary release. Merged on top of luvus's
# built-in rules; a user's own ~/.luvus/manifests/*.toml still wins.
agent = "claude"

# Working (token-counter builds). Newer Claude Code shows a line like:
#   ✢ Inferring… (12s · ↓ 3.2k tokens)
# It dropped the "esc to interrupt" hint and animates a non-braille spinner, so
# match the streaming token counter. Require BOTH "↓ " and "tokens)" so a custom
# statusline containing only one of them (e.g. "↓3" git state) can't false-trigger
# working. The done line ("✻ Cogitated for 18s") has neither, so it stays idle.
[[rule]]
state = "working"
priority = 200
region = "screen"
all = ["↓ ", "tokens)"]

# Working (half-circle spinner builds, e.g. 2.1.228). Some Claude Code builds
# animate a half-circle busy spinner (◐◑◒◓) instead of braille. Newer luvus
# binaries recognize these glyphs natively, but they are matched here as
# substrings too so this rule reaches a binary that predates that support (a
# manifest cannot check line-start for a custom glyph). These half-circles appear
# only in the busy spinner, never the done line or the prompt, so idle panes are
# unaffected.
[[rule]]
state = "working"
priority = 200
region = "screen"
any = ["◐", "◑", "◒", "◓"]
