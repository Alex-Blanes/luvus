id = "example.esp-idf"
name = "ESP-IDF"
version = "0.1.0"
min_luvus_version = "0.9.6"
description = "Build, flash and monitor ESP32 boards without leaving the terminal. Flashing stops the serial monitor, reflashes, and brings the monitor back in the same pane, so you keep the log from before the flash."
platforms = ["macos", "linux"]

# ── Settings (Settings -> Modules -> ESP-IDF) ────────────────────────────────
# Everything the wrapper needs arrives as LUVUS_SETTING_<KEY>, so no script here
# ever parses JSON or reads a config file.

[[settings]]
key = "idf_path"
title = "IDF_PATH (folder containing export.sh)"
type = "string"
default = "~/esp/esp-idf"

[[settings]]
key = "target"
title = "Chip"
type = "enum"
options = ["esp32", "esp32s2", "esp32s3", "esp32c3", "esp32c6", "esp32h2", "esp32p4"]
default = "esp32s3"

# Set by clicking a row in the DEVICES dock; editable here for a port the scan
# does not find (a network/JTAG target, say).
[[settings]]
key = "port"
title = "Serial port"
type = "string"
default = ""

[[settings]]
key = "baud"
title = "Flash baud"
type = "number"
default = 460800
min = 9600
max = 2000000
step = 115200

[[settings]]
key = "flash_method"
title = "Flash over"
type = "enum"
options = ["uart", "dfu", "jtag"]
default = "uart"

# The point of the module: put the monitor back after a flash (see README).
[[settings]]
key = "auto_monitor"
title = "Reopen the monitor after flashing"
type = "bool"
default = true

# ── Panes ────────────────────────────────────────────────────────────────────
# menuconfig is a full-screen TUI, so it gets its own tab rather than taking
# over the pane you invoked it from. This is the whole reason a terminal
# multiplexer suits ESP-IDF: an editor plugin has to rebuild this as a webview.

[[panes]]
id = "partitions"
title = "partitions.csv"
placement = "tab"
command = ["sh", "partitions-pane.sh"]

[[panes]]
id = "menuconfig"
title = "menuconfig"
placement = "tab"
command = ["sh", "menuconfig-pane.sh"]

# ── The DEVICES dock ─────────────────────────────────────────────────────────
# luvus owns the rendering; this module only pushes rows.

# One dock for the whole module: the boards it can see, then the commands that
# act on the selected one. Two docks would compete for the same sidebar height —
# `dock_slots` splits that height across every mounted dock, so a second section
# does not add room, it takes it from the first.
[[docks]]
id = "esp-idf"
title = "ESP-IDF"
placement = "sidebar.left"

# Dock rows are not persisted, so this repaints them after a restart.
[[startup]]
command = ["sh", "dock.sh"]

# A new node is usually a new project; re-scan so the dock is not stale.
[[events]]
on = "workspace.created"
command = ["sh", "dock.sh"]

# ── Actions ──────────────────────────────────────────────────────────────────
# Deliberately no `contexts` on any of these. `contexts` injects an action into
# luvus's own right-click menus, and this module is global — so every node and
# pane in every project would carry ESP-IDF entries whether or not it is
# firmware. The dock is the module's single surface; nothing here reaches into
# menus the user did not ask for.

[[actions]]
id = "select-device"
title = "Use this port"
command = ["sh", "select-device.sh"]

# Backs every plain row in the COMMANDS dock: the subcommand arrives as the
# row's value, so one action serves build / size / clean / partition-table / ...
[[actions]]
id = "run"
title = "Run an ESP-IDF command"
command = ["sh", "idf.sh"]

# Expand/collapse a command group in the dock. The group id rides in as the
# clicked row's value, so one action drives every group.
[[actions]]
id = "toggle"
title = "Expand a command group"
command = ["sh", "toggle.sh"]

[[actions]]
id = "rescan"
title = "Refresh ESP-IDF dock"
command = ["sh", "dock.sh"]

[[actions]]
id = "build"
title = "ESP-IDF: build"
command = ["sh", "idf.sh", "build"]

[[actions]]
id = "flash"
title = "ESP-IDF: flash + monitor"
command = ["sh", "flash-monitor.sh"]

[[actions]]
id = "monitor"
title = "ESP-IDF: monitor"
command = ["sh", "monitor.sh"]

# Opens the pane entrypoint above in its own tab. `$LUVUS_BIN_PATH` is the
# running server's own binary — a bare `luvus` could resolve a different install
# with a different socket and report "no module".
[[actions]]
id = "edit-partitions"
title = "ESP-IDF: edit partition table"
command = ["sh", "-c", '"$LUVUS_BIN_PATH" module pane open example.esp-idf partitions --placement tab']

[[actions]]
id = "menuconfig"
title = "ESP-IDF: menuconfig"
command = ["sh", "-c", '"$LUVUS_BIN_PATH" module pane open example.esp-idf menuconfig --placement tab']

[[actions]]
id = "set-target"
title = "ESP-IDF: set chip target"
command = ["sh", "set-target.sh"]

[[actions]]
id = "size"
title = "ESP-IDF: size"
command = ["sh", "idf.sh", "size"]

[[actions]]
id = "erase"
title = "ESP-IDF: erase flash"
command = ["sh", "idf.sh", "erase-flash"]
