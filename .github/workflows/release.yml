name: release

# Tag a version to ship binaries:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  # The matrix upload jobs attach assets to an existing GitHub Release, so create
  # it first (idempotent — safe to re-run a tag).
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history + tags so the changelog can diff versions
      - name: Generate notes + create/update the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/changelog.sh "$GITHUB_REF_NAME" > notes.md
          echo "----- release notes -----"; cat notes.md; echo "-------------------------"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi

  upload:
    name: ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: both arches. GitHub retired the Intel (macos-13) runners, but
          # an Apple-silicon runner cross-compiles x86_64 fine — Xcode ships both
          # SDKs, so it is just `rustup target add` + `--target`. No Intel runner
          # needed, and Intel macs get a real binary instead of a source build.
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v5
      # Builds (cross-compiling musl/aarch64 via `cross` automatically), packages
      # `luvus-<tag>-<target>.{tar.gz,zip}` + a .sha256, and uploads them to the
      # Release created above.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: luvus
          target: ${{ matrix.target }}
          archive: luvus-$tag-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  # Build native Linux packages (.deb + .rpm) for both arches and attach them to
  # the Release. luvus is a static musl binary, so each package just drops the
  # binary in /usr/bin and declares no hard dependencies (see the Recommends in
  # Cargo.toml [package.metadata.deb]/[.generate-rpm]). `cross` cross-compiles
  # aarch64 on the x86_64 runner; cargo-deb/cargo-generate-rpm read the built
  # binary (`--no-build`) and repoint asset paths at target/<triple>/release via
  # `--target`.
  linux-packages:
    name: pkg ${{ matrix.target }}
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Install cross + cargo-deb (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: cross,cargo-deb
      # cargo-generate-rpm isn't in install-action's catalog, so build it
      # (small crate, ~1 min).
      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked
      - name: Build static binary
        run: cross build --release --target ${{ matrix.target }}
      - name: Version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build .deb
        # --no-build: package the binary cross already built. --no-strip: the
        # release profile already strips, and there is no aarch64 `strip` here.
        env:
          RELEASE_VERSION: ${{ steps.v.outputs.version }}
        run: |
          cargo deb --no-build --no-strip --target ${{ matrix.target }} \
            --output "luvus_${RELEASE_VERSION}_${{ matrix.arch }}.deb"
      - name: Build .rpm
        env:
          RELEASE_VERSION: ${{ steps.v.outputs.version }}
        run: |
          cargo generate-rpm --target ${{ matrix.target }} \
            --output "luvus-${RELEASE_VERSION}-${{ matrix.target }}.rpm"
      - name: Attach packages to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" luvus_*.deb luvus-*.rpm --repo "$GITHUB_REPOSITORY" --clobber

  # Build the macOS notch companion app (separate repo RizRiyz/luvus-notch),
  # ad-hoc sign it (no paid Apple Developer account, so no Developer ID cert and
  # no notarization), attach the DMG to THIS luvus release, and bump the
  # Homebrew cask in RizRiyz/homebrew-luvus.
  #
  # Because the app is unsigned/unnotarized, Gatekeeper will block it on first
  # launch — the cask carries a caveat telling users how to get past that.
  #
  # Extra repo secrets required (in addition to GITHUB_TOKEN):
  #   NOTCH_TOKEN  PAT (repo:read) to check out RizRiyz/luvus-notch
  #   TAP_TOKEN    PAT (repo) to push to RizRiyz/homebrew-luvus
  notch:
    name: luvus-notch.dmg
    needs: create-release
    runs-on: macos-15
    env:
      SCHEME: luvus-notch
      APP_NAME: luvus-notch
      TAP_REPO: RizRiyz/homebrew-luvus
    steps:
      - name: Derive version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check out luvus-notch source
        uses: actions/checkout@v5
        with:
          repository: RizRiyz/luvus-notch
          path: notch
          token: ${{ secrets.NOTCH_TOKEN }}

      - name: Build .app (universal, ad-hoc signed)
        working-directory: notch
        env:
          RELEASE_VERSION: ${{ steps.v.outputs.version }}
        run: |
          # No Developer ID identity available — build unsigned, then apply a
          # deep ad-hoc signature (required or arm64 macOS refuses to launch it).
          xcodebuild build \
            -project luvus-notch.xcodeproj -scheme "$SCHEME" \
            -configuration Release -derivedDataPath "$RUNNER_TEMP/dd" \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$RELEASE_VERSION" \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=""
          APP="$RUNNER_TEMP/dd/Build/Products/Release/$APP_NAME.app"
          codesign --force --deep --sign - "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Build DMG
        id: dmg
        env:
          RELEASE_VERSION: ${{ steps.v.outputs.version }}
        run: |
          DMG="luvus-notch-$RELEASE_VERSION.dmg"
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "luvus-notch" -srcfolder "$STAGE" \
            -fs HFS+ -format UDZO -ov "$DMG"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"

      - name: Attach DMG to this luvus release
        env:
          DMG_PATH: ${{ steps.dmg.outputs.dmg }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "$DMG_PATH" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Bump Homebrew cask
        run: |
          SHA="$(shasum -a 256 "$DMG_PATH" | cut -d' ' -f1)"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" "$RUNNER_TEMP/tap"
          CASK="$RUNNER_TEMP/tap/Casks/luvus-notch.rb"
          sed -i '' -E "s/^  version \".*\"/  version \"$RELEASE_VERSION\"/" "$CASK"
          sed -i '' -E "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" "$CASK"
          cd "$RUNNER_TEMP/tap"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "luvus-notch $RELEASE_VERSION"
          git push
        env:
          DMG_PATH: ${{ steps.dmg.outputs.dmg }}
          RELEASE_VERSION: ${{ steps.v.outputs.version }}
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
