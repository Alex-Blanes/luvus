# Publishes this fork's own builds, which upstream never does.
#
# The in-app updater reads `latest.json` off the newest release and compares its
# `build` against the number `build.rs` baked into the running binary, so every
# push to `main` that changes the code becomes an installable build. Assets are
# bare executables rather than archives: nothing to extract, and one less tool
# the updater has to find on the target machine.
#
# Runs *after* `ci`, not alongside it. Both used to start on the same push, so a
# commit whose tests failed still published a release — and since the updater
# installs the newest one on its own, a red build reached the desktop before
# anyone read the CI mail. That happened once already, with `build-54`.
name: fork release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One release at a time: two overlapping pushes would race on the same tag.
concurrency:
  group: fork-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: build ${{ matrix.target }}
    # `workflow_run` fires for a failed run too, so the conclusion is the guard.
    # A manual dispatch has no run to inspect and is always deliberate.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      # One job at a time: both publish into the same release, and two jobs
      # creating it at once race on the tag.
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/luvus.exe
            asset: luvus-x86_64-pc-windows-msvc.exe
          # Static musl, like upstream's Linux release: runs on any distro's
          # glibc (the NAS is Debian 12), and it is the asset the updater asks
          # for on Linux. Built natively, not in `cross`'s container, so
          # `build.rs` still has git to count the build number.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: target/x86_64-unknown-linux-musl/release/luvus
            asset: luvus-x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      # Full history: `build.rs` counts every commit reachable from HEAD to get
      # the build number, and a shallow clone would count only what it fetched.
      #
      # `ref` is not optional here: a `workflow_run` event checks out the default
      # branch tip by default, which is not necessarily the commit `ci` just went
      # green on. Building something other than what was tested is the exact
      # thing this workflow was reordered to prevent.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Work out the build number
        id: build
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          build=$(git rev-list --count HEAD)
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "build=$build" >>"$GITHUB_OUTPUT"
          echo "tag=build-$build" >>"$GITHUB_OUTPUT"

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package the binary and its digest
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary }}" "dist/${{ matrix.asset }}"
          cd dist
          sha256sum "${{ matrix.asset }}" >"${{ matrix.asset }}.sha256"
          cat >latest.json <<EOF
          {
            "version": "${{ steps.build.outputs.version }}",
            "build": ${{ steps.build.outputs.build }},
            "tag": "${{ steps.build.outputs.tag }}",
            "commit": "${{ github.event.workflow_run.head_sha || github.sha }}"
          }
          EOF

      # `softprops/action-gh-release` replaces the assets if the tag is re-run,
      # so a re-dispatch of the same commit is idempotent rather than a failure.
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.tag }}
          name: ${{ steps.build.outputs.version }} - ${{ steps.build.outputs.build }}
          body: |
            Fork build `${{ steps.build.outputs.build }}` on top of upstream
            v${{ steps.build.outputs.version }} (`${{ github.event.workflow_run.head_sha || github.sha }}`).

            Installed automatically by `luvus update`, or by the in-app check
            when **Install updates automatically** is on.
          files: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
            dist/latest.json
